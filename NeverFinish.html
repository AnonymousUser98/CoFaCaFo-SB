<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Human Verification</title>
<style>
	body {
		margin: 0;
		height: 100vh;
		background: #f2f2f2;
		font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.box {
		width: 360px;
		background: #fff;
		border: 1px solid #ccc;
		border-radius: 6px;
		box-shadow: 0 6px 14px rgba(0,0,0,0.12);
		padding: 20px;
	}

	.title {
		font-size: 14px;
		font-weight: 600;
		margin-bottom: 6px;
	}

	.subtitle {
		font-size: 12px;
		color: #555;
		margin-bottom: 14px;
	}

	.progress {
		height: 8px;
		background: #e0e0e0;
		border-radius: 4px;
		overflow: hidden;
		margin-bottom: 14px;
	}

	.progress-fill {
		height: 100%;
		width: 0%;
		background: linear-gradient(90deg, #4caf50, #8bc34a);
		transition: width 0.6s ease;
	}

	button {
		width: 100%;
		padding: 10px;
		font-size: 13px;
		background: #1976d2;
		color: #fff;
		border: none;
		border-radius: 4px;
		cursor: pointer;
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 8px;
	}

	button:disabled {
		background: #aaa;
		cursor: default;
	}

	.spinner {
		width: 14px;
		height: 14px;
		border: 2px solid rgba(255,255,255,0.6);
		border-top-color: #fff;
		border-radius: 50%;
		animation: spin 1s linear infinite;
	}

	.status {
		font-size: 12px;
		color: #666;
		margin-top: 12px;
		min-height: 1.4em;
	}

	.footer {
		font-size: 10px;
		color: #999;
		margin-top: 16px;
		display: flex;
		justify-content: space-between;
		align-items: center;
	}

	@keyframes spin {
		to { transform: rotate(360deg); }
	}
</style>
</head>
<body>

<div class="box">
	<div class="title">Human Verification</div>
	<div class="subtitle">Confirm you are not automated</div>

	<div class="progress">
		<div class="progress-fill" id="progress"></div>
	</div>

	<button id="verifyBtn">
		<span id="btnText">Verify</span>
	</button>

	<div class="status" id="status">
		Awaiting confirmation…
	</div>

	<div class="footer">
		<span>Powered by SecureVerify™</span>
		<span>v3.9</span>
	</div>
</div>

<script>
(function () {
	const btn = document.getElementById("verifyBtn");
	const btnText = document.getElementById("btnText");
	const progress = document.getElementById("progress");
	const status = document.getElementById("status");

	const phrases = [
		"Almost done…",
		"Finalizing verification…",
		"Running last checks…",
		"Confirming interaction source…",
		"Verifying completion status…",
		"One more moment…"
	];

	let percent = 0;
	let cycle = 0;

	function fakeProcess() {
		btn.disabled = true;
		btnText.textContent = "Verifying";
		btn.insertAdjacentHTML("beforeend", '<div class="spinner"></div>');
		status.textContent = phrases[Math.floor(Math.random() * phrases.length)];

		let interval = setInterval(() => {
			percent += 5 + Math.random() * 5;
			if (percent > 98) percent = 98; // Never reaches 100
			progress.style.width = percent + "%";
		}, 300);

		setTimeout(() => {
			clearInterval(interval);
			btn.disabled = false;
			btn.querySelector(".spinner")?.remove();

			cycle++;

			if (cycle % 3 === 0) {
				status.textContent = "Additional verification required.";
				btnText.textContent = "Continue";
				percent = 60 + Math.random() * 20;
			} else {
				status.textContent = "Verification nearing completion…";
				btnText.textContent = Math.random() < 0.5 ? "Almost Done" : "Final Step";
			}

			progress.style.width = percent + "%";
		}, 2000 + Math.random() * 2000);
	}

	btn.addEventListener("click", fakeProcess);
})();
</script>

</body>
</html>
