<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Human Verification</title>
<style>
	body {
		font-family: Arial, sans-serif;
		background: #f2f2f2;
		display: flex;
		justify-content: center;
		align-items: center;
		height: 100vh;
		margin: 0;
	}

	.captcha-box {
		background: white;
		width: 360px;
		padding: 16px;
		border-radius: 4px;
		box-shadow: 0 2px 6px rgba(0,0,0,0.25);
	}

	.title {
		font-size: 14px;
		margin-bottom: 8px;
	}

	.image-wrapper {
		width: 100%;
		height: 220px;
		background: #ddd;
		display: flex;
		align-items: center;
		justify-content: center;
		margin-bottom: 10px;
		overflow: hidden;
	}

	.image-wrapper img {
		width: 100%;
		height: 100%;
		object-fit: cover;
	}

	textarea {
		width: 100%;
		height: 60px;
		resize: none;
		padding: 6px;
		box-sizing: border-box;
		font-size: 13px;
	}

	.status {
		font-size: 12px;
		color: #666;
		margin-top: 6px;
		min-height: 16px;
	}

	button {
		margin-top: 10px;
		width: 100%;
		padding: 9px;
		font-size: 14px;
		cursor: pointer;
		background: #1a73e8;
		color: white;
		border: none;
		border-radius: 3px;
	}

	button:hover {
		background: #1765cc;
	}

	button:disabled {
		background: #8ab4f8;
		cursor: default;
	}

	.error {
		color: #d93025;
	}

	.spinner {
		display: inline-block;
		width: 12px;
		height: 12px;
		border: 2px solid #ccc;
		border-top: 2px solid #555;
		border-radius: 50%;
		animation: spin 1s linear infinite;
		margin-right: 6px;
		vertical-align: middle;
	}

	@keyframes spin {
		to { transform: rotate(360deg); }
	}
</style>
</head>
<body>

<div class="captcha-box">
	<div class="title">Describe the image to verify you are human</div>

	<div class="image-wrapper">
		<img id="captchaImage" alt="Verification image">
	</div>

	<textarea id="description" placeholder="Describe what you see in the image..."></textarea>

	<button id="submitBtn">Verify</button>

	<div class="status" id="status"></div>
</div>

<script>
	const img = document.getElementById("captchaImage");
	const textarea = document.getElementById("description");
	const status = document.getElementById("status");
	const button = document.getElementById("submitBtn");

	function loadNewImage() {
		const seed = Math.random().toString(36).slice(2);
		img.src = `https://picsum.photos/400/300?random=${seed}`;
	}

	function fakeVerify() {
		const text = textarea.value.trim();

		if (!text) {
			status.innerHTML = '<span class="error">Description required. Please describe the image before continuing.</span>';
			return;
		}

		status.innerHTML = '<span class="spinner"></span>Analyzing description...';
		button.disabled = true;

		setTimeout(() => {
			status.textContent = "Additional verification required. Please describe the next image.";
			textarea.value = "";
			loadNewImage();
			button.disabled = false;
		}, 1800);
	}

	button.addEventListener("click", fakeVerify);

	loadNewImage();
</script>

</body>
</html>
